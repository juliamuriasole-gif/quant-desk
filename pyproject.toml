[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant-desk"
version = "0.1.0"
description = "Role-separated, offline quant research desk: seven agents, one constitution. Research and paper trading only."
readme = "README.md"
license = "MIT"
authors = [{ name = "Júlia Muria Solé", email = "juliamuriasole@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
quant-desk = "quant_desk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_desk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
